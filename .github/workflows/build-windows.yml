name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar PyInstaller
        run: pip install "pyinstaller>=6.15,<7"

      - name: Crear ejecutable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name AUTOMATIZACION_BN
          --add-data "automation_profile.json;."
          app.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: AUTOMATIZACION_BN-Windows
          path: dist/AUTOMATIZACION_BN.exe